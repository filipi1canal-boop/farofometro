<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Farofômetro 🌴</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ── Background Scenery ─────────────────────────────── -->
<div class="bg">
  <div class="sun-glow"></div>
  <!-- SVG Waves -->
  <svg class="bg-wave wave-layer" viewBox="0 0 1440 120" preserveAspectRatio="none" style="bottom: 0px">
    <path d="M0,60 C200,100 400,20 600,60 C800,100 1000,20 1200,60 C1320,80 1380,50 1440,40 L1440,120 L0,120Z" fill="var(--ocean)"/>
  </svg>
  <svg class="bg-wave wave-layer" viewBox="0 0 1440 120" preserveAspectRatio="none" style="bottom: 0px; opacity: 0.6">
    <path d="M0,80 C180,120 360,40 540,80 C720,120 900,40 1080,75 C1260,110 1380,70 1440,80 L1440,120 L0,120Z" fill="#0077b6"/>
  </svg>
</div>

<!-- ── Hero ───────────────────────────────────────────── -->
<div class="container" style="text-align: center; padding-top: 40px; margin-bottom: 20px;">
  <!-- Decor elements -->
  <div class="anim-pop" style="margin-bottom: -15px;">
    <svg width="60" height="60" viewBox="0 0 24 24" fill="none" stroke="var(--sun)" stroke-width="1.5">
      <circle cx="12" cy="12" r="5" fill="var(--sun)"/>
      <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
    </svg>
  </div>
  
  <h1 class="hero-title">
    <span class="t-ocean">Farof</span><span class="t-sun">ômetro</span>
  </h1>
  <p style="color: var(--c-text2); margin-top: 10px; font-weight: 500; letter-spacing: 1px;">
    QUEM FICOU NA MEMÓRIA? 🌴
  </p>
  
  <!-- Status Badge -->
  <div id="statusBadge" style="margin-top: 15px;"></div>
</div>

<!-- ── Navigation Cards ──────────────────────────────── -->
<div class="container">
  
  <!-- Votar -->
  <div class="glass anim-up" style="animation-delay: 0.1s; padding: 0;">
    <a href="votar.html" style="display: flex; align-items: center; padding: 20px; text-decoration: none; color: inherit;">
      <div style="background: rgba(0, 180, 216, 0.2); padding: 15px; border-radius: 12px; margin-right: 15px;">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="var(--ocean)" stroke-width="2">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
          <path d="M9 12l2 2 4-4"/>
        </svg>
      </div>
      <div style="flex: 1;">
        <h2 style="margin-bottom: 4px; font-size: 1.3rem;">Votar</h2>
        <p style="font-size: 0.85rem; color: var(--c-text2);">Avalie seus colegas com ícones anônimos</p>
      </div>
      <div>
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--ocean)" stroke-width="2">
          <path d="M9 5l7 7-7 7"/>
        </svg>
      </div>
    </a>
  </div>
  
  <!-- Telão -->
  <div class="glass anim-up" style="animation-delay: 0.2s; padding: 0;">
    <a href="telao.html" style="display: flex; align-items: center; padding: 20px; text-decoration: none; color: inherit;">
      <div style="background: rgba(255, 214, 10, 0.2); padding: 15px; border-radius: 12px; margin-right: 15px;">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="var(--sun)" stroke-width="2">
          <rect x="2" y="7" width="20" height="15" rx="2" ry="2"/>
          <polyline points="17 2 12 7 7 2"/>
        </svg>
      </div>
      <div style="flex: 1;">
        <h2 style="margin-bottom: 4px; font-size: 1.3rem;">Telão</h2>
        <p style="font-size: 0.85rem; color: var(--c-text2);">Resultados em tempo real na TV</p>
      </div>
      <div>
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--sun)" stroke-width="2">
          <path d="M9 5l7 7-7 7"/>
        </svg>
      </div>
    </a>
  </div>
  
  <!-- Admin -->
  <div class="glass anim-up" style="animation-delay: 0.3s; padding: 0;">
    <a href="admin.html" style="display: flex; align-items: center; padding: 20px; text-decoration: none; color: inherit;">
      <div style="background: rgba(255, 107, 107, 0.2); padding: 15px; border-radius: 12px; margin-right: 15px;">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="var(--coral)" stroke-width="2">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
      </div>
      <div style="flex: 1;">
        <h2 style="margin-bottom: 4px; font-size: 1.3rem;">Admin</h2>
        <p style="font-size: 0.85rem; color: var(--c-text2);">Controle do evento</p>
      </div>
      <div>
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--coral)" stroke-width="2">
          <path d="M9 5l7 7-7 7"/>
        </svg>
      </div>
    </a>
  </div>
  
</div>

<script src="app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="sync.js"></script>
<script>
  const { getState } = FF;
  const s = getState();
  const DIA_LABEL = { 1: '12/Nov', 2: '13/Nov', 3: '14/Nov', 4: '15/Nov' };
  
  // Status Badge
  const bdg = document.getElementById('statusBadge');
  if (s.votingOpen) {
    bdg.innerHTML = `<span class="pill pill-open">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 8v4l3 3"/></svg>
      VOTAÇÃO ABERTA · ${DIA_LABEL[s.currentDay] || 'DIA '+s.currentDay}
    </span>`;
  } else {
    bdg.innerHTML = `<span class="pill pill-closed">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      VOTAÇÃO FECHADA
    </span>`;
  }
</script>
</body>
</html>
